[metadata]
name = pmd-pycore
version = 0.1.1
author = Pieter Plaisier
author_email = pieter@hanweiconsulting.com
description = PMD PyCore - Python Interface for ElmorLabs PMD2/PMD2X/PMD-USB
long_description = file: README.md
long_description_content_type = text/markdown
license_files = MIT
url = https://github.com/ElmorLabs-P1/pmd-pycore
project_urls =
    Bug Tracker = https://github.com/ElmorLabs-P1/pmd-pycore/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.11
install_requires =
    pyserial >= 3.5

[options.extras_require]
dev =
    build
    pytest
